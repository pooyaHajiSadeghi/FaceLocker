name: Build Windows EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'
      - run: python -m pip install -r requirements/build-requirements.txt
      - run: python src/build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: FaceLocker-Windows-x64
          path: dist/FaceLocker.exe
